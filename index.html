function step(d){if(d.rest)return;d.x+=d.vx;d.y+=d.vy;d.z+=d.vz;d.vz-=.55;d.a+=d.sp;if(frame%3===0)d.v=1+Math.floor(Math.random()*6);if(d.z<=0){d.z=0;if(Math.abs(d.vz)>1.4){d.vz=-d.vz*.55;d.vx*=.82;d.vy*=.82;d.sp*=.7;snd(110,.05)}else{d.vz=0;d.vx*=.91;d.vy*=.91}}if(d.x>l&&d.x<r&&d.y>t&&d.y<bt)d.inside=true;if(d.inside){if(d.x<l||d.x>r){d.x=Math.max(l,Math.min(r,d.x));d.vx*=-.7;snd(90,.04)}if(d.y<t||d.y>bt){d.y=Math.max(t,Math.min(bt,d.y));d.vy*=-.7;snd(90,.04)}}if(frame>100||d.inside&&d.z===0&&Math.hypot(d.vx,d.vy)<.25){d.rest=true;d.x=Math.max(l,Math.min(r,d.x));d.y=Math.max(t,Math.min(bt,d.y));d.z=0;d.v=d.f;d.a=0}}
function coll(){const [a,b]=D,dx=b.x-a.x,dy=b.y-a.y,q=Math.hypot(dx,dy);if(a.rest&&b.rest||!a.inside||!b.inside||a.z>8||b.z>8||q>=size||q<.01)return;const nx=dx/q,ny=dy/q,o=(size-q)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(v<0){a.vx+=v*nx;a.vy+=v*ny;b.vx-=v*nx;b.vy-=v*ny;snd(260,.05)}}
function draw(d){z.fillStyle='#0005';z.beginPath();z.ellipse(d.x,d.y+5,size*.45,size*.16,0,0,7);z.fill();z.save();z.translate(d.x,d.y-d.z*.6);z.rotate(d.a);z.fillStyle='#fff7df';z.strokeStyle='#8a7440';z.lineWidth=1.5;z.beginPath();z.roundRect(-size/2,-size/2,size,size,5);z.fill();z.stroke();z.fillStyle=d.v===1?'#c8281e':'#241c16';PIPS[d.v].forEach(([x,y])=>{z.beginPath();z.arc(x*size/4,y*size/4,size*.075,0,7);z.fill()});z.restore()}
function tick(now){if(e!==epoch)return;acc+=last?Math.min(50,now-last):16;last=now;while(acc>=16.67){frame++;D.forEach(step);coll();acc-=16.67}z.clearRect(0,0,w,h);D.forEach(draw);if(D.every(d=>d.rest)){settled ||= now;if(now-settled>700){layer.replaceChildren();rolling=false;controls();return}}requestAnimationFrame(tick)}snd(300,.15,'triangle');requestAnimationFrame(tick)}
function transfer(G,from,to,amt){const p=G.players[from],paid=Math.min(amt,Math.max(0,p.balance));p.balance-=paid;if(to&&G.players[to])G.players[to].balance+=paid;if(paid<amt){p.alive=false;for(const k of Object.keys(G.owners||{}))if(G.owners[k]===from){delete G.owners[k];if(G.houses)delete G.houses[k]}L(G,p.name+' збанкрутував')}}function next(G){const al=G.order.filter(id=>G.players[id].alive);if(al.length<=1){G.status='finished';G.winner=al[0]||'';L(G,'Переміг '+pn(G,G.winner));return}do{G.turn=(G.turn+1)%G.order.length}while(!G.players[cur(G)].alive);G.phase='roll'}
async function mutate(fn){if(busy||!room)return;busy=true;controls();try{await runTransaction(ref(db,'pixelRooms/'+room),G=>G&&fn(G)!==false?G:undefined,{applyLocally:false})}catch(e){$('info').textContent=e.message}finally{busy=false;controls()}}
$('roll').onclick=()=>{const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),bonus=[-800,-400,500,1000,1500][Math.floor(Math.random()*5)];mutate(G=>{if(G.status!=='playing'||cur(G)!==uid||G.phase!=='roll')return false;const p=G.players[uid],o=p.pos;p.pos=(o+a+b)%40;G.lastDice=[a,b];G.rid=Date.now();if(o+a+b>=40){const s=G.mode==='fast'?1000:2000;p.balance+=s;L(G,p.name+' зарплата +'+s)}const c=CELLS[p.pos];L(G,p.name+' кидає '+a+'+'+b);L(G,p.name+' → '+c.name);if([8,32].includes(c.o)){const t=G.mode==='hard'?2000:1000;transfer(G,uid,null,t);L(G,'Податок '+t)}else if([3,22,36,18,38].includes(c.o)){if(bonus<0)transfer(G,uid,null,-bonus);else p.balance+=bonus;L(G,(bonus>0?'Бонус ':'Витрати ')+Math.abs(bonus))}else if(c.price&&G.owners?.[p.pos]&&G.owners[p.pos]!==uid){const r=rent(G,p.pos);transfer(G,uid,G.owners[p.pos],r);L(G,'Оренда '+r)}G.phase=p.alive&&c.price&&!G.owners?.[p.pos]?'buy':'end';if(!p.alive)next(G)})};
$('buy').onclick=()=>mutate(G=>{if(G.status!=='playing'||cur(G)!==uid||G.phase!=='buy')return false;const p=G.players[uid],c=CELLS[p.pos];if(!c.price||G.owners?.[p.pos]||p.balance<c.price)return false;p.balance-=c.price;G.owners??={};G.owners[p.pos]=uid;G.phase='end';L(G,p.name+' купує '+c.name+' за '+c.price);snd(700,.2,'triangle')});$('end').onclick=()=>mutate(G=>{if(G.status!=='playing'||cur(G)!==uid||!['buy','end'].includes(G.phase))return false;next(G)});$('bld').onclick=()=>{const i=sel;mutate(G=>{if(G.status!=='playing'||cur(G)!==uid||!canBuild(G,uid,i))return false;G.players[uid].balance-=hcost(CELLS[i]);G.houses??={};G.houses[i]=(G.houses[i]||0)+1;L(G,pn(G,uid)+' будує на '+CELLS[i].name+' (рівень '+G.houses[i]+')')})};
$('chat').onsubmit=e=>{e.preventDefault();const v=$('ci').value.trim();if(!v||!g?.players[uid]||Date.now()-lastChat<600)return;lastChat=Date.now();$('ci').value='';push(ref(db,'pixelRooms/'+room+'/chat'),{id:Date.now(),t:pn(g,uid)+': '+v,u:uid}).catch(e=>$('info').textContent=e.message)};
function open(code){un?.();room=code;shown={};lastRid=null;sel=null;rolling=false;epoch++;$('dice').replaceChildren();un=onValue(ref(db,'pixelRooms/'+code),s=>{if(!s.exists()){lobby();return}g=s.val();render();if(lastRid!==null&&g.rid!==lastRid&&g.lastDice)toss(...g.lastDice);lastRid=g.rid},e=>alert(e.message))}function lobby(){un?.();un=null;g=null;room='';epoch++;rolling=false;$('dice').replaceChildren();$('lobby').hidden=false;$('waiting').hidden=$('game').hidden=true} $('exit').onclick=$('back').onclick=lobby;
$('start').onclick=()=>mutate(G=>{if(G.host!==uid||G.status!=='waiting'||G.order.length<2)return false;G.status='playing';G.phase='roll';G.turn=0;L(G,'Партію розпочато')});$('create').onclick=async()=>{if(!uid)return alert('Зачекайте на авторизацію');const code=Math.random().toString(36).slice(2,8).toUpperCase().padEnd(6,'0'),m=$('mode').value;try{await set(ref(db,'pixelRooms/'+code),{code,mode:m,host:uid,status:'waiting',created:Date.now(),players:{[uid]:{name:nm(),balance:bal(m),pos:0,alive:true}},order:[uid],turn:0,phase:'roll',owners:{},logs:[{id:1,t:'Кімнату створено'}],lastDice:[1,1],rid:0,winner:''});open(code)}catch(e){alert(e.message)}};
async function join(code){if(!uid)return;code=String(code).trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return alert('Код має містити 6 символів');try{const r=await runTransaction(ref(db,'pixelRooms/'+code),G=>{if(!G)return;if(!G.players[uid]){if(G.status!=='waiting'||G.order.length>=6)return;G.players[uid]={name:nm(),balance:bal(G.mode),pos:0,alive:true};G.order.push(uid);L(G,nm()+' приєднався')}return G},{applyLocally:false});if(r.committed)open(code);else alert('Кімната недоступна')}catch(e){alert(e.message)}}$('join').onclick=()=>join($('rc').value);
try{const t=window.Telegram?.WebApp;t?.ready();t?.expand();$('nm').value=t?.initDataUnsafe?.user?.first_name||''}catch{}onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;onValue(query(ref(db,'pixelRooms'),limitToLast(30)),s=>{const a=Object.values(s.val()||{}).filter(r=>r.status==='waiting'&&r.order?.length<6).sort((a,b)=>b.created-a.created);$('rooms').innerHTML=a.map(r=>`<div class="room"><span>${esc(r.code)} · ${r.order.length}/6</span><button data-code="${esc(r.code)}">Увійти</button></div>`).join('')||'Відкритих кімнат немає';$('rooms').querySelectorAll('button').forEach(b=>b.onclick=()=>join(b.dataset.code))},e=>$('rooms').textContent=e.message);const c=new URLSearchParams(location.search).get('room');if(c)join(c)});signInAnonymously(auth).catch(e=>$('rooms').textContent='Помилка авторизації: '+e.code);
