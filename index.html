$('start').onclick=()=>mutate(G=>{if(G.host!==uid||G.status!=='waiting'||G.order.length<2)return false;G.status='playing';G.phase='roll';G.turn=0;L(G,'Партію розпочато')});$('create').onclick=async()=>{if(!uid)return alert('Зачекайте на авторизацію');const code=Math.random().toString(36).slice(2,8).toUpperCase().padEnd(6,'0'),m=$('mode').value;try{await set(ref(db,'pixelRooms/'+code),{code,mode:m,host:uid,status:'waiting',created:Date.now(),players:{[uid]:{name:nm(),balance:bal(m),pos:0,alive:true}},order:[uid],turn:0,phase:'roll',owners:{},logs:[{id:1,t:'Кімнату створено'}],lastDice:[1,1],rid:0,winner:''});open(code)}catch(e){alert(e.message)}};
async function join(code){if(!uid)return;code=String(code).trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return alert('Код має містити 6 символів');try{const r=await runTransaction(ref(db,'pixelRooms/'+code),G=>{if(!G)return;if(!G.players[uid]){if(G.status!=='waiting'||G.order.length>=6)return;G.players[uid]={name:nm(),balance:bal(G.mode),pos:0,alive:true};G.order.push(uid);L(G,nm()+' приєднався')}return G},{applyLocally:false});if(r.committed)open(code);else alert('Кімната недоступна')}catch(e){alert(e.message)}}$('join').onclick=()=>join($('rc').value);
try{const t=window.Telegram?.WebApp;t?.ready();t?.expand();$('nm').value=t?.initDataUnsafe?.user?.first_name||''}catch{}onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;onValue(query(ref(db,'pixelRooms'),limitToLast(30)),s=>{const a=Object.values(s.val()||{}).filter(r=>r.status==='waiting'&&r.order?.length<6).sort((a,b)=>b.created-a.created);$('rooms').innerHTML=a.map(r=>`<div class="room"><span>${esc(r.code)} · ${r.order.length}/6</span><button data-code="${esc(r.code)}">Увійти</button></div>`).join('')||'Відкритих кімнат немає';$('rooms').querySelectorAll('button').forEach(b=>b.onclick=()=>join(b.dataset.code))},e=>$('rooms').textContent=e.message);const c=new URLSearchParams(location.search).get('room');if(c)join(c)});signInAnonymously(auth).catch(e=>$('rooms').textContent='Помилка авторизації: '+e.code);
