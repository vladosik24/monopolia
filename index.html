<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор Монополії</title><style>*{box-sizing:border-box}body{background:#101827;color:#fff;font:15px system-ui;margin:0;padding:12px}h2{margin:4px 0 12px}main{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}#board{display:grid;width:min(100%,480px);aspect-ratio:3/4;background:#e9dfc5;gap:2px;padding:3px;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);border:2px solid #777} .tile{position:relative;background:#fff;color:#222;overflow:hidden;border:1px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(6px,1.7vw,10px);cursor:pointer;min-width:0;min-height:0}.tile img{width:90%;height:48%;object-fit:contain}.tile.selected{outline:3px solid #00d8ff;z-index:2}.stripe{position:absolute;top:0;left:0;width:100%;height:15%;background:var(--c)}.tile span{overflow-wrap:anywhere}.center{grid-area:2/2/11/11;display:grid;place-items:center;color:#a21b25;text-align:center;font-size:clamp(18px,5vw,32px);font-weight:900;background-size:cover;background-position:center}aside{width:min(100%,420px);background:#1e293b;padding:14px;border-radius:12px}label{display:block;margin:9px 0 3px}input,select,button{font:inherit;border:1px solid #536176;border-radius:7px;padding:9px;background:#111827;color:white;width:100%}input[type=color]{height:42px}button{background:#2563eb;margin-top:8px;cursor:pointer}small{color:#b7c4d8} .pair{display:flex;gap:8px}.pair>*{flex:1;min-width:0}</style><h2>Редактор дошки · Монополія Україна</h2><main><div id="board"></div><aside><b id="sel"></b><label>Назва</label><input id="name"><label>Тип</label><select id="type"><option value="property">Місто / власність</option><option value="chance">Шанс</option><option value="chest">Скарбниця</option><option value="tax">Податок</option><option value="station">Станція</option><option value="utility">Комунальні послуги</option><option value="corner">Кутова клітинка</option></select><div class="pair"><div><label>Колір групи</label><input type="color" id="color"></div><div><label>Ціна, грн</label><input type="number" id="price" min="0"></div></div><label>Зображення клітинки (URL або tiles/0.png)</label><input id="img"><input type="file" id="pic" accept="image/*"><button id="clearPic">Прибрати зображення</button><label>Поміняти місцями з клітинкою № (0–39)</label><div class="pair"><input id="swapNum" type="number" min="0" max="39"><button id="swap">Поміняти</button></div><hr><label>Пропорції дошки</label><div class="pair"><input id="w" type="number" min="1" value="3"><input id="h" type="number" min="1" value="4"></div><label>Колір центру</label><input id="bg" type="color" value="#e9dfc5"><label>Фон центру (зображення)</label><input id="centerPic" type="file" accept="image/*"><button id="clearCenter">Прибрати фон</button><button id="save">Зберегти JSON</button><label>Відкрити збережений JSON</label><input id="load" type="file" accept=".json,application/json"><small id="status">Натисни на будь-яку клітинку для редагування.</small></aside></main><script>
const $=id=>document.getElementById(id);const names=['Старт','Ужгород','Скарбниця','Луцьк','Податок','Станція Південна','Чернігів','Шанс','Тернопіль','Рівне','В’язниця','Черкаси','Водоканал','Кропивницький','Житомир','Станція Західна','Миколаїв','Скарбниця','Херсон','Вінниця','Парковка','Поділля','Шанс','Волинь','Буковина','Станція Північна','Шевченка','Франка','Електростанція','Лесі Українки','До в’язниці','Київ','Львів','Скарбниця','Одеса','Станція Східна','Шанс','Харків','Податок','Дніпро'];const groups={1:'#95542e',3:'#95542e',6:'#71c7ee',8:'#71c7ee',9:'#71c7ee',11:'#d946a0',13:'#d946a0',14:'#d946a0',16:'#f39a24',18:'#f39a24',19:'#f39a24',21:'#e53935',23:'#e53935',24:'#e53935',26:'#f5d000',27:'#f5d000',29:'#f5d000',31:'#239b56',32:'#239b56',34:'#239b56',37:'#254cba',39:'#254cba'};let data={width:3,height:4,background:'#e9dfc5',centerImage:'',tiles:names.map((name,i)=>({name,type:groups[i]?'property':i%10===0?'corner':name==='Шанс'?'chance':name==='Скарбниця'?'chest':name==='Податок'?'tax':i%10===5?'station':'utility',color:groups[i]||'#ffffff',price:groups[i]?Math.min(400,60+Math.floor(i/3)*20):i%10===5?200:0,img:''}))};let active=0;function pos(i){return i<=10?[11,11-i]:i<=20?[21-i,1]:i<=30?[1,i-19]:[i-29,11]}function render(){let b=$('board');b.replaceChildren();b.style.aspectRatio=data.width+'/'+data.height;let c=document.createElement('div');c.className='center';c.style.backgroundColor=data.background;if(data.centerImage)c.style.backgroundImage='url('+JSON.stringify(data.centerImage)+')';else c.textContent='МОНОПОЛІЯ УКРАЇНА';b.append(c);data.tiles.forEach((t,i)=>{let e=document.createElement('div');e.className='tile'+(active===i?' selected':'');let [r,col]=pos(i);e.style.gridArea=r+'/'+col;e.style.setProperty('--c',t.color);let s=document.createElement('div');s.className='stripe';e.append(s);if(t.img){let im=document.createElement('img');im.src=t.img;e.append(im)}let n=document.createElement('span');n.textContent=t.name;e.append(n);if(t.price){let p=document.createElement('span');p.textContent=t.price+' ₴';e.append(p)}e.onclick=()=>{active=i;sync();render()};b.append(e)})}function sync(){let t=data.tiles[active];$('sel').textContent='Клітинка №'+active;for(let k of ['name','type','color','price','img'])$(k).value=t[k];$('w').value=data.width;$('h').value=data.height;$('bg').value=data.background}for(let k of ['name','type','color','price','img'])$(k).oninput=()=>{data.tiles[active][k]=k==='price'?Math.max(0,Number($(k).value)||0):$(k).value;render()};for(let [id,k] of [['w','width'],['h','height']])$(id).oninput=()=>{data[k]=Math.max(1,Number($(id).value)||1);render()};$('bg').oninput=()=>{data.background=$('bg').value;render()};function readPic(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>{cb(r.result);sync();render()};r.readAsDataURL(file)}$('pic').onchange=()=>{let i=active;readPic($('pic').files[0],v=>data.tiles[i].img=v)};$('centerPic').onchange=()=>readPic($('centerPic').files[0],v=>data.centerImage=v);$('clearPic').onclick=()=>{data.tiles[active].img='';sync();render()};$('clearCenter').onclick=()=>{data.centerImage='';render()};$('swap').onclick=()=>{let n=Number($('swapNum').value);if($('swapNum').value!==''&&Number.isInteger(n)&&n>=0&&n<40){[data.tiles[n],data.tiles[active]]=[data.tiles[active],data.tiles[n]];active=n;sync();render()}};$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='board.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('load').onchange=async()=>{try{let d=JSON.parse(await $('load').files[0].text());if(!Array.isArray(d.tiles)||d.tiles.length!==40||!d.tiles.every(t=>typeof t.name==='string'&&typeof t.color==='string'&&typeof t.type==='string')||!(d.width>0&&d.height>0))throw Error();data=d;active=0;sync();render();$('status').textContent='Дошку завантажено.'}catch(e){$('status').textContent='Некоректний файл дошки.'}};sync();render();</script></html>
