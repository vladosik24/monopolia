// 11 слотів на кожній стороні: 1 кут + 9 проміжних клітинок + 1 кут = 11 сегментів
function fit(){
  DPR=Math.min(3,window.devicePixelRatio||1);
  W=innerWidth;
  H=innerHeight-142;

  BY=34+Math.ceil(n/cl)*54+2;
  const Hb=H-BY-4;
  // Квадратна або збалансована дошка 11x11 клітинок
  CS=Math.max(38,Math.round(Math.min(W/11,Hb/11)));

function R(i){
  const {bx,by,bw,bh}=boardBox;
  // 0: низ-право (Старт), 1..8: низ справа наліво, 9: низ-ліво (В'язниця)
  if(i===0)return{x:bx+bw-CS,y:by+bh-CS,w:CS,h:CS,s:'c'};
  if(i>=1&&i<=8)return{x:bx+bw-CS-i*CS,y:by+bh-CS,w:CS,h:CS,s:'b'};
  if(i===9)return{x:bx,y:by+bh-CS,w:CS,h:CS,s:'c'};
  // 10..18: ліво знизу вгору, 19: верх-ліво (Стоянка)
  if(i>=10&&i<=18)return{x:bx,y:by+bh-CS-(i-9)*CS,w:CS,h:CS,s:'l'};
  if(i===19)return{x:bx,y:by,w:CS,h:CS,s:'c'};
  // 20..28: верх зліва направо, 29: верх-право (Ідіть до в'язниці)
  if(i>=20&&i<=28)return{x:bx+CS+(i-20)*CS,y:by,w:CS,h:CS,s:'t'};
  if(i===29)return{x:bx+bw-CS,y:by,w:CS,h:CS,s:'c'};
  // 30..39: право згори вниз
  return{x:bx+bw-CS,y:by+CS+(i-30)*CS,w:CS,h:CS,s:'r'};
}

$('rooms').innerHTML=a.length?a.map(r=>'<div class="room"><div><span>'+esc(r.code)+'</span><br><small>'+esc(({classic:'Класичний',fast:'Швидкий',rich:'Багатій',hard:'Хардкор'})[r.mode]||r.mode)+' · '+r.order.length+'/6</small></div><button data-r="'+esc(r.code)+'">УВІЙТИ</button></div>').join(''):'Відкритих кімнат немає';$('rooms').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>join(b.dataset.r))},e=>{$('rooms').textContent='Помилка: '+e.message})}
try{const tu=window.Telegram&&Telegram.WebApp;tu&&tu.ready();tu&&tu.expand();const u=getTgUser();if(u)$('nm').value=(u.first_name||'').slice(0,20)}catch(e){}
onAuthStateChanged(auth,u=>{if(u){uid=u.uid;$('st').style.display='none';rooms();const c=new URLSearchParams(location.search).get('room');if(c)join(c)}});
