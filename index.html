<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Монополія Україна 4.0</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><header><h1>🎩 Монополія Україна 🇺🇦</h1><span id="status">Підключення…</span></header><main><section id="welcome" class="panel"><h2>Онлайн-гра</h2><input id="nick" maxlength="24" placeholder="Ваше ім'я"><select id="mode"><option value="classic">🎩 Класичний</option><option value="fast">⚡ Швидкий</option><option value="rich">💎 Багатій</option><option value="hard">🔥 Хардкор</option></select><button id="create">Створити кімнату</button><div class="join"><input id="roomcode" maxlength="6" placeholder="Код кімнати"><button id="join">Приєднатись</button></div><p class="hint">2–6 гравців. Поділіться кодом кімнати з друзями.</p></section><section id="game" hidden><div class="panel"><div class="topline"><strong id="roomtitle"></strong><button id="share">📋 Код</button></div><div id="players"></div><p id="turn"></p><div id="lobby"><button id="start">▶️ Почати гру</button></div></div><div id="board" aria-label="Ігрове поле"></div><div class="panel"><div id="dice">🎲 🎲</div><div id="event">Очікування…</div><div class="actions"><button id="roll">🎲 Кинути кубики</button><button id="buy">🏠 Купити</button><button id="skip">⏭ Пропустити</button><button id="end">➡️ Завершити хід</button></div></div></section></main><script type="module" src="app.js"></script></body></html>
