<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08172e"><title>Монополія Україна Pixel</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header class="top"><div class="brand">🎲 МОНОПОЛІЯ <b>УКРАЇНА</b><small>PIXEL EDITION</small></div><div id="status">Підключення…</div></header>
<section id="lobby" class="screen"><div class="hero"><div class="skyline">🏰　🏙️　🌳　🏛️</div><h1>МІСТА ТА ІМПЕРІЇ</h1><p>Будуй • Торгуй • Перемагай</p><div class="pixel-dice">⚄ ⚅</div></div><div class="panel"><label>Ім'я гравця <input id="nickname" maxlength="20" placeholder="Ваше ім’я"></label><label>Режим <select id="mode"><option value="classic">🎩 Класичний</option><option value="fast">⚡ Швидкий</option><option value="rich">💰 Багатій</option><option value="hard">🔥 Хардкор</option></select></label><button id="create" class="gold">＋ СТВОРИТИ КІМНАТУ</button><div class="join"><input id="roomCode" placeholder="Код кімнати" maxlength="8"><button id="join">УВІЙТИ</button></div></div><div class="panel"><div class="line"><h2>ВІДКРИТІ КІМНАТИ</h2><button id="refresh" class="small">⟳</button></div><div id="rooms">Завантаження…</div></div></section>
<section id="game" class="screen hidden"><div class="roomhead"><button id="back" class="small">← ЛОБІ</button><span id="roomTitle">Кімната</span><button id="copy" class="small">КОД ⧉</button></div><div id="players" class="players"></div><div id="waiting" class="panel hidden"><p>Очікування гравців (2–6)</p><button id="start" class="gold">▶ ПОЧАТИ ГРУ</button></div><div class="board" id="board"><div id="tiles"></div><div class="center"><div class="centerTitle">🇺🇦 МІСТА ТА ІМПЕРІЇ</div><div id="turnInfo" class="turn">Очікування…</div><div id="feed" class="feed"></div><div class="send"><input id="chatInput" maxlength="180" placeholder="Написати повідомлення…"><button id="send">➤</button></div></div></div><div class="controls"><div class="dice" id="dice"><div class="die" id="die1">⚀</div><div class="die" id="die2">⚀</div></div><div class="actions"><button id="roll" class="gold">🎲 КИНУТИ КУБИКИ</button><button id="buy" class="hidden">🏠 КУПИТИ</button><button id="end" class="hidden">⏭ ЗАВЕРШИТИ ХІД</button></div><div class="tools"><button id="property">🏘️ МАЙНО</button><button id="sound">🔊 ЗВУК</button><button id="rules">📜 ПРАВИЛА</button></div></div></section><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"><div class="modalbox"><button id="closeModal" class="small">✕</button><div id="modalContent"></div></div></div></div>
<script type="module" src="app.js"></script></body></html>
