$('mg').onclick=()=>{const i=sel;mutate(G=>{const c=CELLS[i];if(i==null||!c||!isO(c)||G.status!='playing'||cur(G)!=uid||G.phase=='auction'||!G.owners||G.owners[i]!==uid||((G.houses&&G.houses[i])||0))return false;const p=G.players[uid];G.mort=G.mort||{};if(G.mort[i]){const cost=Math.round(c.price*.55);if(p.balance<cost)return false;p.balance-=cost;delete G.mort[i];L(G,p.name+' викупив '+c.name+' із застави (−'+cost+')')}else{const v=Math.round(c.price/2);G.mort[i]=1;p.balance+=v;L(G,p.name+' заставив '+c.name+' (+'+v+')')}})};
$('buy').onclick=()=>mutate(G=>{if(G.status!='playing'||cur(G)!=uid||G.phase!='buy')return false;const p=G.players[uid],c=CELLS[p.pos];if(!isO(c)||(G.owners&&G.owners[p.pos])||p.balance<c.price)return false;p.balance-=c.price;G.owners=G.owners||{};G.owners[p.pos]=uid;G.phase='end';L(G,p.name+' купує '+c.name+' за '+c.price);snd(700,.2,'triangle')});
$('bld').onclick=()=>{const i=sel;mutate(G=>{if(i==null||G.status!='playing'||cur(G)!=uid||!canBuild(G,uid,i))return false;const c=CELLS[i],p=G.players[uid];p.balance-=hcost(c);G.houses=G.houses||{};G.houses[i]=(G.houses[i]||0)+1;L(G,p.name+' будує на '+c.name+' (рівень '+G.houses[i]+')');})};
$('end').onclick=()=>mutate(G=>{if(G.status!='playing'||cur(G)!=uid||!['buy','end'].includes(G.phase))return false;const p=G.players[uid],c=CELLS[p.pos];if(G.phase=='buy'&&isO(c)&&!(G.owners&&G.owners[p.pos])){startAuction(G);return}next(G)});
function sendChat(){const v=$('ci').value.trim();if(!v||!room||!g||!g.players[uid]||Date.now()-lastSend<600)return;lastSend=Date.now();$('ci').value='';push(ref(db,'pixelRooms/'+room+'/chat'),{id:Date.now(),t:g.players[uid].name+': '+v,u:uid}).catch(e=>{info='Чат: '+e.message;infoT=200})}
$('cs').onclick=sendChat;$('ci').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();sendChat()}};
// ===== обмін, аукціон, час сервера =====
let toff=0;onValue(ref(db,'.info/serverTimeOffset'),s=>{toff=s.val()||0});const now=()=>Date.now()+toff;
const AUC_T=12000,AUC_RE=6000;let tdr=null,aT=0;
function startAuction(G){const p=G.players[cur(G)],c=CELLS[p.pos];G.auction={i:p.pos,bid:0,leader:'',end:now()+AUC_T,min:Math.max(50,Math.round(c.price*.1))};G.phase='auction';L(G,'Аукціон: '+c.name)}
const bidBtns={b1:100,b2:500,b3:1000};
Object.keys(bidBtns).forEach(id=>$(id).onclick=()=>mutate(G=>{const a=G.auction,p=G.players[uid];if(G.status!='playing'||G.phase!='auction'||!a||!p||!p.alive||a.leader===uid||now()>a.end)return false;const nb=Math.max(a.min,(a.bid||0)+bidBtns[id]);if(p.balance<nb)return false;a.bid=nb;a.leader=uid;a.end=Math.max(a.end,now()+AUC_RE);L(G,p.name+' ставить '+nb);snd(700,.06)}));
const resolveAuction=()=>mutate(G=>{const a=G.auction;if(G.phase!='auction'||!a||now()<a.end)return false;const w=a.leader&&G.players[a.leader];if(w&&w.balance>=a.bid){w.balance-=a.bid;G.owners=G.owners||{};G.owners[a.i]=a.leader;L(G,w.name+' виграв аукціон: '+CELLS[a.i].name+' за '+a.bid)}else L(G,'Аукціон без ставок');G.auction=null;next(G)});
const tcells=(G,id)=>CELLS.filter(c=>isO(c)&&G.owners&&G.owners[c.i]===id&&!((G.houses&&G.houses[c.i])||0)&&!(G.mort&&G.mort[c.i])).map(c=>c.i);
function cardRect(i){const n=g.order.length,cl=n<=3?n:n==4?2:3,cw=(W-12)/cl;return{x:6+(i%cl)*cw,y:34+Math.floor(i/cl)*54,w:cw-6,h:48}}
function cardHit(px,py){if(g.status!='playing'||!g.players[uid]||!g.players[uid].alive||tdr||(g.trade&&g.trade.status=='pending'))return false;for(let i=0;i<g.order.length;i++){const id=g.order[i],r=cardRect(i);if(id!==uid&&g.players[id].alive&&px>=r.x&&px<r.x+r.w&&py>=r.y&&py<r.y+r.h){tdr={to:id,give:new Set(),ask:new Set(),gc:0,ac:0};trRender();return true}}return false}
const nmz=n=>esc(noE(n)),list=(ids,sel,side)=>ids.map(i=>'<label class="it"><input type="checkbox" data-s="'+side+'" data-i="'+i+'"'+(sel&&sel.has(i)?' checked':'')+'><span class="dot" style="background:'+CELLS[i].color+'"></span>'+nmz(CELLS[i].name)+' · '+CELLS[i].price+'</label>').join('')||'<small>немає ділянок</small>',
desc=(ids,c)=>[...(ids||[]).map(i=>nmz(CELLS[i].name)),...(c?[c+' ₴']:[])].join(', ')||'нічого';
function trRender(){const tm=$('tm'),bn=$('tbn'),t=g&&g.trade;bn.style.display='none';
if(!g||g.status!='playing'){tm.classList.add('hid');return}
if(tdr){const me=g.players[uid],o=g.players[tdr.to];tm.classList.remove('hid');tm.innerHTML='<div class="tb"><h2>Обмін з '+nmz(o.name)+'</h2><div class="tcols"><div><h4>Віддаєш</h4>'+list(tcells(g,uid),tdr.give,'g')+'<div class="cash"><button data-a="gm">−</button><b>'+tdr.gc+' ₴</b><button data-a="gp">+</button></div></div><div><h4>Просиш</h4>'+list(tcells(g,tdr.to),tdr.ask,'a')+'<div class="cash"><button data-a="am">−</button><b>'+tdr.ac+' ₴</b><button data-a="ap">+</button></div></div></div><div class="tbtn"><button data-a="send">Запропонувати</button><button class="b" data-a="cancel">Скасувати</button></div></div>';return}
if(t&&t.status=='pending'&&t.to===uid){tm.classList.remove('hid');tm.innerHTML='<div class="tb"><h2>Обмін від '+nmz(g.players[t.from].name)+'</h2><p>Віддає тобі: <b>'+desc(t.give,t.gc)+'</b></p><p>Просить у тебе: <b>'+desc(t.ask,t.ac)+'</b></p><div class="tbtn"><button data-a="yes">Прийняти</button><button class="b" data-a="no">Відхилити</button></div></div>';return}
tm.classList.add('hid');if(t&&t.from===uid){bn.style.display='flex';bn.innerHTML='<span>Обмін: чекаємо '+nmz(g.players[t.to].name)+'</span><button class="red" data-a="cancel2">Скасувати</button>'}}
$('tm').onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a||!tdr&&!(g&&g.trade))return;
if(tdr){const me=g.players[uid],o=g.players[tdr.to];if(a=='gm')tdr.gc=Math.max(0,tdr.gc-500);if(a=='gp')tdr.gc=Math.min(me.balance,tdr.gc+500);if(a=='am')tdr.ac=Math.max(0,tdr.ac-500);if(a=='ap')tdr.ac=Math.min(o.balance,tdr.ac+500);if(a=='cancel'){tdr=null}
if(a=='send'){const d=tdr;if(!d.give.size&&!d.ask.size&&!d.gc&&!d.ac)return;tdr=null;mutate(G=>{if(G.trade&&G.trade.status=='pending')return false;const ok=[...d.give].every(i=>G.owners&&G.owners[i]===uid)&&[...d.ask].every(i=>G.owners&&G.owners[i]===d.to);if(!ok)return false;G.trade={id:now(),from:uid,to:d.to,give:[...d.give],ask:[...d.ask],gc:d.gc,ac:d.ac,status:'pending'};L(G,G.players[uid].name+' пропонує обмін '+G.players[d.to].name)})}
trRender();return}
const t=g.trade;if(a=='no')mutate(G=>{if(!G.trade||G.trade.to!==uid)return false;L(G,G.players[uid].name+' відхилив обмін');G.trade=null});
if(a=='yes')mutate(G=>{const t=G.trade;if(!t||t.to!==uid||t.status!='pending')return false;const A=t.from,B=t.to,gv=t.give||[],ak=t.ask||[],hs=G.houses||{},ok=G.players[A]&&G.players[B]&&G.players[A].alive&&gv.every(i=>G.owners&&G.owners[i]===A&&!hs[i]&&!isMg(G,i))&&ak.every(i=>G.owners&&G.owners[i]===B&&!hs[i]&&!isMg(G,i))&&G.players[A].balance>=(t.gc||0)&&G.players[B].balance>=(t.ac||0);if(!ok){L(G,'Обмін не вдався: умови змінились');G.trade=null;return}gv.forEach(i=>G.owners[i]=B);ak.forEach(i=>G.owners[i]=A);G.players[A].balance+=(t.ac||0)-(t.gc||0);G.players[B].balance+=(t.gc||0)-(t.ac||0);L(G,'Обмін: '+G.players[A].name+' ↔ '+G.players[B].name);G.trade=null;snd(660,.15,'triangle')})}
$('tm').onchange=e=>{const d=e.target.dataset;if(!tdr||!d||!d.i)return;const s=d.s=='g'?tdr.give:tdr.ask,i=+d.i;e.target.checked?s.add(i):s.delete(i)};
$('tbn').onclick=e=>{if(e.target.dataset&&e.target.dataset.a=='cancel2')mutate(G=>{if(!G.trade||G.trade.from!==uid)return false;L(G,'Обмін скасовано');G.trade=null})};

$('start').onclick=()=>mutate(G=>{if(G.host!=uid||G.status!='waiting'||G.order.length<2)return false;G.status='playing';G.phase='roll';G.turn=0;L(G,'Партію розпочато')});
const nm=()=>($('nm').value.trim()||(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe.user&&Telegram.WebApp.initDataUnsafe.user.first_name)||'Гравець').slice(0,20),bal=m=>m=='rich'?30000:m=='hard'?10000:15000;
$('create').onclick=async()=>{if(!uid)return alert('Зачекайте на авторизацію');const code=Math.random().toString(36).slice(2,8).toUpperCase(),m=$('mode').value;try{await set(ref(db,'pixelRooms/'+code),{code,mode:m,host:uid,status:'waiting',created:Date.now(),players:{[uid]:{name:nm(),balance:bal(m),pos:0,alive:true,photo:getTgPhoto()}},order:[uid],turn:0,phase:'roll',owners:{},logs:[{id:1,t:'Кімнату створено'}],lastDice:[1,1],rid:0,winner:''});open(code)}catch(e){alert('Не вдалося створити: '+e.message)}};
async function join(code){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return alert('Код має містити 6 символів');try{const r=await runTransaction(ref(db,'pixelRooms/'+code),G=>{if(!G)return;G.players=G.players||{};G.order=G.order||[];if(!G.players[uid]){if(G.status!='waiting'||G.order.length>=6)return;G.players[uid]={name:nm(),balance:bal(G.mode),pos:0,alive:true,photo:getTgPhoto()};G.order.push(uid);L(G,nm()+' приєднався')}return G},{applyLocally:false});if(!r.committed)return alert('Кімнату не знайдено, гра йде або немає місць');open(code)}catch(e){alert('Помилка входу: '+e.message)}}
$('join').onclick=()=>join($('rc').value);
function open(code){unG&&unG();room=code;first=true;vp={};D=null;$('lob').classList.add('hid');$('wt').classList.remove('hid');$('fin').classList.add('hid');$('cd').textContent=code;
unG=onValue(ref(db,'pixelRooms/'+code),s=>{if(!s.exists()){lobby();return}g=s.val();g.order=g.order||[];g.owners=g.owners||{};
// preload avatars
if(g.players){Object.values(g.players).forEach(p=>{if(p.photo)loadAv(p.photo)})}
setTimeout(trRender,0);
if(g.status=='waiting'){$('ov').style.display='block';$('wt').classList.remove('hid');$('fin').classList.add('hid');$('pl').innerHTML=g.order.map((id,i)=>'<span style="color:'+COL[i%6]+'">■</span> '+esc(g.players[id].name)+(id==g.host?' ★':'')).join('<br>');$('start').style.display=g.host==uid?'block':'none';$('start').disabled=g.order.length<2;return}
if(first){first=false;lastRid=g.rid;g.order.forEach(id=>vp[id]=g.players[id].pos)}
if(g.rid!==lastRid){lastRid=g.rid;toss(g.lastDice[0],g.lastDice[1])}
if(g.status=='finished'){$('ov').style.display='block';$('wt').classList.add('hid');$('fin').classList.remove('hid');$('win').textContent='ПЕРЕМІГ '+pn(g,g.winner)}else $('ov').style.display='none'})}
function lobby(){sel=null;tdr=null;$('tm').classList.add('hid');$('tbn').style.display='none';$('chat').style.display='none';unG&&unG();unG=null;room='';g=null;D=null;$('ov').style.display='block';$('lob').classList.remove('hid');$('wt').classList.add('hid');$('fin').classList.add('hid');$('roll').style.display=$('buy').style.display=$('end').style.display='none'}
$('exit').onclick=()=>{if(g)lobby()};$('back').onclick=lobby;$('back2').onclick=lobby;
function rooms(){unR&&unR();unR=onValue(query(ref(db,'pixelRooms'),limitToLast(30)),s=>{const a=Object.values(s.val()||{}).filter(r=>r.status=='waiting'&&r.order&&r.order.length<6).sort((p,q)=>q.created-p.created).slice(0,15);
$('rooms').innerHTML=a.length?a.map(r=>'<div class="room"><div><b>'+esc(r.code)+'</b><br><small>'+esc(({classic:'Класичний',fast:'Швидкий',rich:'Багатій',hard:'Хардкор'})[r.mode]||r.mode)+' · '+r.order.length+'/6</small></div><button data-r="'+esc(r.code)+'">УВІЙТИ</button></div>').join(''):'Відкритих кімнат немає';$('rooms').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>join(b.dataset.r))},e=>{$('rooms').textContent='Помилка: '+e.message})}
try{const tu=window.Telegram&&Telegram.WebApp;tu&&tu.ready();tu&&tu.expand();const u=tu&&tu.initDataUnsafe&&tu.initDataUnsafe.user;if(u)$('nm').value=(u.first_name||'').slice(0,20)}catch(e){}
