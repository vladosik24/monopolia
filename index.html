$('create').onclick=async()=>{if(!uid)return alert('Зачекайте на авторизацію');const code=Math.random().toString(36).slice(2,8).toUpperCase(),m=$('mode').value;try{await set(ref(db,'pixelRooms/'+code),{code,mode:m,host:uid,status:'waiting',created:Date.now(),players:{[uid]:{name:nm(),ph:myPh,balance:bal(m),pos:0,alive:true}},order:[uid],turn:0,phase:'roll',owners:{},logs:[{id:1,t:'Кімнату створено'}],lastDice:[1,1],rid:0,winner:'',gid:0,round:1,pot:0});open(code)}catch(e){alert('Не вдалося створити: '+e.message)}};
async function join(code){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return alert('Код має містити 6 символів');try{const r=await runTransaction(ref(db,'pixelRooms/'+code),G=>{if(!G)return;G.players=G.players||{};G.order=G.order||[];if(!G.players[uid]){if(G.status!='waiting'||G.order.length>=6)return;G.players[uid]={name:nm(),ph:myPh,balance:bal(G.mode),pos:0,alive:true};G.order.push(uid);L(G,nm()+' приєднався')}else if(myPh)G.players[uid].ph=myPh;return G},{applyLocally:false});if(!r.committed)return alert('Кімнату не знайдено, гра йде або немає місць');open(code)}catch(e){alert('Помилка входу: '+e.message)}}
$('join').onclick=()=>join($('rc').value);
let recd={},lastGid=null,pres=false;
function open(code){unG&&unG();room=code;first=true;vp={};D=null;lastLog=null;pres=false;lastCurId=null;lastGid=null;try{localStorage.setItem('lastRoom',code)}catch(e){}MP.id=null;$('lob').classList.add('hid');$('wt').classList.remove('hid');$('fin').classList.add('hid');$('cd').textContent=code;
unG=onValue(ref(db,'pixelRooms/'+code),s=>{if(!s.exists()){lobby();return}g=s.val();g.order=g.order||[];g.owners=g.owners||{};setTimeout(()=>{trRender();tiRender()},0);
if(!pres&&g.players&&g.players[uid]){pres=true;const pr=ref(db,'pixelRooms/'+code+'/players/'+uid+'/online');set(pr,true).catch(()=>{});onDisconnect(pr).set(false).catch(()=>{});if(myPh&&g.players[uid].ph!==myPh)set(ref(db,'pixelRooms/'+code+'/players/'+uid+'/ph'),myPh).catch(()=>{})}
if(g.status=='waiting'){$('ov').style.display='block';$('wt').classList.remove('hid');$('fin').classList.add('hid');$('pl').innerHTML=g.order.map((id,i)=>'<span style="color:'+COL[i%6]+'">■</span> '+esc(g.players[id].name)+(id==g.host?' ★':'')).join('<br>');$('start').style.display=g.host==uid?'block':'none';$('start').disabled=g.order.length<2;return}
if(g.gid!==lastGid){lastGid=g.gid;first=true}
if(first){first=false;lastRid=g.rid;g.order.forEach(id=>vp[id]=g.players[id].pos)}
logSfx();musSync();if(g.rid!==lastRid){lastRid=g.rid;toss(g.lastDice[0],g.lastDice[1])}
if(g.status=='finished'){$('ov').style.display='block';$('wt').classList.add('hid');$('fin').classList.remove('hid');$('win').textContent='ПЕРЕМІГ '+pn(g,g.winner);$('rank').innerHTML=g.order.slice().sort((a,b)=>netW(g,b)-netW(g,a)).map((id,i)=>'<div class="rk"><span>'+(i+1)+'.</span><b style="color:'+COL[g.order.indexOf(id)%6]+'">'+esc(noE(g.players[id].name))+'</b><em>'+netW(g,id)+' ₴</em></div>').join('');$('again').style.display=g.host==uid?'block':'none';const k=room+':'+g.gid;if(g.players[uid]&&!recd[k]){recd[k]=1;record()}}else $('ov').style.display='none'})}
function lobby(){try{if(room&&g&&g.players&&g.players[uid])set(ref(db,'pixelRooms/'+room+'/players/'+uid+'/online'),false)}catch(e){}sel=null;tdr=null;['tm','mn','ti'].forEach(i=>$(i).classList.add('hid'));$('tbn').style.display='none';$('chat').style.display='none';unG&&unG();unG=null;room='';g=null;D=null;$('ov').style.display='block';$('lob').classList.remove('hid');$('wt').classList.add('hid');$('fin').classList.add('hid');['roll','buy','end','jb','pay','bidrow'].forEach(i=>$(i).style.display='none');MP.aud.pause();MP.id=null;$('mnb').style.display='none';checkCont()}
$('exit').onclick=()=>{if(g)lobby()};$('back').onclick=lobby;$('back2').onclick=lobby;
function rooms(){unR&&unR();unR=onValue(query(ref(db,'pixelRooms'),limitToLast(30)),s=>{const a=Object.values(s.val()||{}).filter(r=>r.status=='waiting'&&r.order&&r.order.length<6).sort((p,q)=>q.created-p.created).slice(0,15);
$('rooms').innerHTML=a.length?a.map(r=>'<div class="room"><div><b>'+esc(r.code)+'</b><br><small>'+esc(({classic:'Класичний',fast:'Швидкий',rich:'Багатій',hard:'Хардкор'})[r.mode]||r.mode)+' · '+r.order.length+'/6</small></div><button data-r="'+esc(r.code)+'">УВІЙТИ</button></div>').join(''):'Відкритих кімнат немає';$('rooms').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>join(b.dataset.r))},e=>{$('rooms').textContent='Помилка: '+e.message})}
try{const tu=window.Telegram&&Telegram.WebApp;tu&&tu.ready();tu&&tu.expand();const u=tu&&tu.initDataUnsafe&&tu.initDataUnsafe.user;if(u)$('nm').value=(u.first_name||'').slice(0,20)}catch(e){}
onAuthStateChanged(auth,u=>{if(u){uid=u.uid;$('st').style.display='none';rooms();topList();checkCont();const c=new URLSearchParams(location.search).get('room');if(c)join(c)}});
signInAnonymously(auth).catch(e=>{$('st').textContent='помилка входу';alert('Увімкніть Anonymous Authentication у Firebase: '+e.code)});
