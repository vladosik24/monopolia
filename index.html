<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f28"><title>Монополія Україна 🇺🇦</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div><strong>🎩 Монополія Україна</strong><small>Telegram Mini App · 4.0</small></div><span id="connection">● Підключення…</span></header><section id="home" class="panel"><h1>🇺🇦 Грай з друзями</h1><p>Українські міста, кубики, нерухомість та великі угоди.</p><label>Твоє ім'я<input id="nickname" maxlength="24" placeholder="Ім'я гравця"></label><label>Режим гри<select id="mode"><option value="classic">🎩 Класичний</option><option value="fast">⚡ Швидкий</option><option value="rich">💰 Багатій</option><option value="hard">🔥 Хардкор</option></select></label><button id="create">➕ Створити кімнату</button><div class="join"><input id="roomCode" placeholder="Код кімнати" maxlength="8"><button id="join">Увійти</button></div><p class="hint">Відкрий у Telegram або у звичайному браузері. Для спільної гри потрібне підключення Firebase.</p></section><section id="game" hidden><div class="toolbar"><div><b id="roomLabel">Кімната</b><small id="modeLabel"></small></div><button class="secondary" id="share">🔗 Запросити</button><button class="secondary" id="leave">Вийти</button></div><div id="players" class="players"></div><div class="board-wrap"><div id="board" class="board"><div class="board-center"><div class="logo">🇺🇦<br>МОНОПОЛІЯ<br><em>УКРАЇНА</em></div><div id="dice" class="dice">🎲 🎲</div><div id="status">Очікуємо гравців…</div><div id="actions"></div></div></div></div><div class="panel"><h3>📜 Події партії</h3><div id="log" class="log"></div></div></section><div id="toast" role="status"></div></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="config.js"></script><script src="game.js"></script></body></html>
